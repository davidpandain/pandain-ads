<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>판다인 광고 운영실</title>
<style>
:root{--bg:#F4F6F8;--fg:#5A6371;--ring:#DFE3E8;--accent:#4263EB}
@media (prefers-color-scheme:dark){:root{--bg:#0E1115;--fg:#98A1AE;--ring:#29303A;--accent:#748FFC}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.box{text-align:center;padding:0 16px;max-width:420px}
.sp{width:30px;height:30px;margin:0 auto 14px;border:3px solid var(--ring);border-top-color:var(--accent);border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="box" id="box"><div class="sp"></div>광고 운영실을 여는 중…</div>
<script>
// 판다인 광고 운영실 입구 — https://ads.pandain.co.kr (GitHub Pages, 저장소 davidpandain/pandain-ads)
//  원본: davidpandain/cafe24-meta-sync 의 console/ads/index.html. 이 파일은 거의 바뀌지 않는다.
//  화면 코드는 운영실 서버(구글 Apps Script)가 공유드라이브의 검증된 화면 파일을 내려 주고, 로그인·데이터도 같은 서버가 처리한다.
var API = "https://script.google.com/macros/s/AKfycbxN77b5Y1rzmnkr7O8IIM2KnXt5G0PSeVwhcimVZHKSnayv_PpRHGtcza-tuhqK8tSb/exec";
function fail(e) {
  document.getElementById("box").innerHTML = "<p>광고 운영실 서버에 연결하지 못했습니다.</p><p style=\"font-size:13px\">" +
    String((e && e.message) || e).replace(/[<>&]/g, "") + "</p><p><a href=\"?fresh\">다시 시도</a></p>";
}
//  속도(26-10-06): 받은 화면 코드를 이 브라우저에 보관해 다음부터는 바로 연다(서버 왕복 ~1.7초 절약).
//  화면이 뜬 뒤 3초 뒤 새 화면 코드를 받아 바뀌었으면 보관만 바꾼다(다음에 열 때 적용). 주소 끝 ?fresh 는 보관 무시.
//  /dashboard·/budget 같은 탭 주소는 GitHub Pages 가 404.html(이 파일과 같은 내용)로 연다 → 화면이 주소를 보고 그 탭을 연다.
// 구글 일시 오류(JSON 대신 오류 화면)면 최대 2번 더 받기
function getUi(n) {
  return fetch(API, { method: "POST", body: JSON.stringify({ f: "ui" }) }).then(function (r) { return r.json(); })
    .catch(function (e) { if (n > 1) return new Promise(function (ok) { setTimeout(ok, 1000); }).then(function () { return getUi(n - 1); }); throw e; });
}
function show(h) { document.open(); document.write(h); document.close(); }
//  안전장치: 보관본으로 열 때 'pending' 표시 → 화면이 시작하면 'ok'. 다음에 열 때 아직 'pending' 이면(지난번 보관본이 시작도 못 함)
//  보관본을 버리고 서버에서 새로 받는다. 보관본에 지금 서버 주소(API)가 없어도 버린다.
var cached = null;
try {
  if (!/[?&]fresh\b/.test(location.search) && localStorage.getItem("ops_ui_boot") !== "pending") cached = localStorage.getItem("ops_ui");
  if (!cached || !/^<!doctype html>/i.test(cached) || cached.indexOf(API) < 0) { cached = null; localStorage.removeItem("ops_ui"); }
} catch (e) { cached = null; }
//  보관본은 이 문서를 다 읽은 뒤에 바꿔 쓴다 — 읽는 도중 document.open 은 무시돼 화면이 '여는 중…' 아래에 덧붙는다(10-06 대표 화면).
if (cached) {
  try { localStorage.setItem("ops_ui_boot", "pending"); } catch (e) { /* */ }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { show(cached); }); else show(cached);
}
else getUi(3)
  .then(function (j) {
    if (!j.ok) throw new Error(j.err || "서버 오류");
    try { localStorage.setItem("ops_ui", j.r); } catch (e) { try { localStorage.removeItem("ops_ui"); } catch (e2) { /* */ } }
    show(j.r);
  })
  .catch(fail);
</script>
</body>
</html>
